<header class="header">
  <h1 class="header__title">{{ title() }} <span aria-hidden="true">✨</span></h1>

  <div class="header__mode-slot">
    <ng-content />
  </div>

  <button type="button" class="header__save" [class.saving]="saveState() === 'saving'" [disabled]="saveState() === 'saving'" (click)="save.emit()">
    <span class="header__save-label">
      @if (saveState() === 'saving') {
        <span class="header__spinner" aria-hidden="true"></span>
        Saving…
      } @else {
        Save
      }
    </span>
  </button>
</header>
