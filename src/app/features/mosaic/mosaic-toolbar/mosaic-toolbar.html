<div class="toolbar">
  <button type="button" class="toolbar__btn toolbar__btn--panel" (click)="openPanel.emit()">
    <span class="toolbar__icon" aria-hidden="true">🎨</span>
    <span>Palette</span>
  </button>
  @if (mode() === 'photo') {
    <button type="button" class="toolbar__btn" (click)="replacePhoto.emit()">
      <span class="toolbar__icon" aria-hidden="true">🖼</span>
      <span>Replace photo</span>
    </button>
  }
  <button type="button" class="toolbar__btn" [class.active]="tool() === 'paint'" (click)="toolChange.emit('paint')">
    <span class="toolbar__icon" aria-hidden="true">🖌</span>
    <span>Paint</span>
  </button>
  <button type="button" class="toolbar__btn" [class.active]="tool() === 'eraser'" (click)="toolChange.emit('eraser')">
    <span class="toolbar__icon" aria-hidden="true">⬚</span>
    <span>Eraser</span>
  </button>
  <button
    type="button"
    class="toolbar__btn"
    [class.active]="panMode()"
    (click)="panModeToggle.emit()"
    title="Toggle pan tool (or hold Space)"
  >
    <span class="toolbar__icon" aria-hidden="true">✋</span>
    <span>Pan</span>
  </button>
  <span class="toolbar__divider" aria-hidden="true"></span>
  <button type="button" class="toolbar__btn" [disabled]="!canUndo()" (click)="undo.emit()">
    <span class="toolbar__icon" aria-hidden="true">↶</span>
    <span>Undo</span>
  </button>
  <button type="button" class="toolbar__btn" [disabled]="!canRestart()" (click)="restart.emit()">
    <span class="toolbar__icon" aria-hidden="true">↺</span>
    <span>Restart</span>
  </button>
</div>
