<div class="editor">
  <app-editor-header class="editor__header" [saveState]="saveState()" [saveMessage]="saveMessage()" (save)="onSave()">
    <app-segmented-switch [options]="editorModeOptions" [value]="editorMode()" ariaLabel="Editing mode" (valueChange)="onEditorModeChange($event)" />
  </app-editor-header>

  @if (editorMode() === 'freehand') {
    <div class="editor__bg-switch">
      <app-segmented-switch [options]="backgroundOptions" [value]="store.mode()" ariaLabel="Canvas background" (valueChange)="onModeChange($event)" />

      <!-- Desktop-only: the mobile sheet keeps its own Canvas shape section
           (see .editor__shape-section--top-bar below). -->
      <div class="editor__top-extra">
        <span class="editor__divider" aria-hidden="true"></span>
        <div class="editor__shape-field">
          <span class="editor__field-label">Canvas shape</span>
          <app-canvas-shape-select [value]="store.canvasShapeId()" (valueChange)="onCanvasShapeRequested($event)" />
        </div>
      </div>
    </div>

    <div class="editor__canvas-region">
      <app-design-canvas
        #freehandCanvas
        [mode]="store.mode()"
        [backgroundColor]="store.backgroundColor()"
        [canvasWidth]="store.canvasWidth()"
        [canvasHeight]="store.canvasHeight()"
        [photoUrl]="store.photoUrl()"
        [photoOffsetX]="store.photoOffsetX()"
        [photoOffsetY]="store.photoOffsetY()"
        [photoScale]="store.photoScale()"
        [photoZoomMin]="store.photoZoomRange.min"
        [photoZoomMax]="store.photoZoomRange.max"
        [gems]="store.gems()"
        [selectedGemId]="store.selectedGemId()"
        [exitingGemIds]="exitingGemIds()"
        (placeAt)="onPlaceAt($event)"
        (selectGem)="onSelectGem($event)"
        (gemDragStart)="onGemDragStart()"
        (gemDragTo)="onGemDragTo($event)"
        (gemDragEnd)="onGemDragEnd()"
        (gemResizeInput)="onSelectedSizeInput($event)"
        (gemResizeCommitted)="onSelectedSizeCommitted($event)"
        (photoFileSelected)="onPhotoFileSelected($event)"
        (photoOffsetChange)="store.setPhotoOffset($event.x, $event.y)"
        (photoScaleChange)="store.setPhotoScale($event)"
        (adjustingPhotoChange)="adjustingPhoto.set($event)"
      />
    </div>

    <app-editor-hint class="editor__hint" [text]="hintText()" />

    @if (store.selectedGem(); as gem) {
      <div class="editor__selected-mobile">
        <app-selected-gem-controls
          [assetSrc]="gem.asset.src"
          [assetLabel]="gem.asset.label"
          [size]="gem.size"
          [sizeMin]="store.gemSizeRange.min"
          [sizeMax]="store.gemSizeRange.max"
          (sizeInput)="onSelectedSizeInput($event)"
          (sizeCommitted)="onSelectedSizeCommitted($event)"
          (duplicate)="store.duplicateSelected()"
          (delete)="onDeleteSelected()"
        />
      </div>
    }

    <app-editor-toolbar
      class="editor__toolbar"
      [mode]="store.mode()"
      [canUndo]="store.canUndo()"
      [canRestart]="store.canRestart()"
      [sizePopoverOpen]="sizePopoverOpen()"
      [gemSize]="store.newGemSize()"
      [sizeMin]="store.gemSizeRange.min"
      [sizeMax]="store.gemSizeRange.max"
      [sizePreviewSrc]="sizePreviewSrc()"
      [randomMode]="store.randomMode()"
      (openGems)="onOpenGems()"
      (replacePhoto)="freehandCanvas.triggerUpload()"
      (openSize)="onOpenSizePopover()"
      (closeSize)="onCloseSizePopover()"
      (sizeInput)="store.setNewGemSize($event)"
      (sizeCommitted)="store.setNewGemSize($event)"
      (randomModeToggle)="store.toggleRandomMode()"
      (undo)="onUndo()"
      (restart)="onRestartClick()"
    />

    <aside class="editor__aside">
      <section class="editor__shape-section editor__shape-section--top-bar">
        <h3 class="editor__shape-heading">Canvas shape</h3>
        <app-canvas-shape-control [value]="store.canvasShapeId()" (valueChange)="onCanvasShapeRequested($event)" />
      </section>

      <app-gem-library
        [assets]="catalogue"
        [categories]="categories"
        [activeCategory]="store.activeCategory()"
        [activeAssetId]="store.activeAssetId()"
        (categoryChange)="store.setActiveCategory($event)"
        (assetChange)="store.setActiveAsset($event)"
      />

      @if (store.selectedGem(); as gem) {
        <app-selected-gem-controls
          [assetSrc]="gem.asset.src"
          [assetLabel]="gem.asset.label"
          [size]="gem.size"
          [sizeMin]="store.gemSizeRange.min"
          [sizeMax]="store.gemSizeRange.max"
          (sizeInput)="onSelectedSizeInput($event)"
          (sizeCommitted)="onSelectedSizeCommitted($event)"
          (duplicate)="store.duplicateSelected()"
          (delete)="onDeleteSelected()"
        />
      }
    </aside>

    <app-gem-sheet [open]="gemSheetOpen()" (closed)="onCloseGemSheet()">
      <section class="editor__shape-section">
        <h3 class="editor__shape-heading">Canvas shape</h3>
        <app-canvas-shape-control [value]="store.canvasShapeId()" (valueChange)="onCanvasShapeRequested($event)" />
      </section>

      <app-gem-library
        [assets]="catalogue"
        [categories]="categories"
        [activeCategory]="store.activeCategory()"
        [activeAssetId]="store.activeAssetId()"
        (categoryChange)="store.setActiveCategory($event)"
        (assetChange)="store.setActiveAsset($event)"
      />
    </app-gem-sheet>

    <app-confirm-dialog
      [open]="showRestartConfirm()"
      title="Restart this design?"
      message="This clears every placed gem. Your background or photo stays."
      confirmLabel="Restart"
      cancelLabel="Cancel"
      (confirmed)="onRestartConfirm()"
      (cancelled)="onRestartCancel()"
    />

    <app-confirm-dialog
      [open]="pendingCanvasShape() !== null"
      title="Change the canvas shape?"
      message="This clears every placed gem. Your background or photo stays."
      confirmLabel="Change shape"
      cancelLabel="Cancel"
      (confirmed)="onConfirmCanvasShapeChange()"
      (cancelled)="onCancelCanvasShapeChange()"
    />

    <app-photo-setup-dialog
      [open]="photoSetupOpen()"
      [photoUrl]="pendingPhotoUrl()"
      [canvasShapeId]="store.canvasShapeId()"
      [zoomMin]="store.photoZoomRange.min"
      [zoomMax]="store.photoZoomRange.max"
      (canvasShapeRequested)="onCanvasShapeRequested($event)"
      (confirmed)="onPhotoSetupConfirmed($event)"
      (cancelled)="onPhotoSetupCancelled()"
    />
  } @else {
    <app-mosaic-editor class="editor__mosaic-host" />
  }

  @if (exportError(); as message) {
    <p class="editor__error" role="alert">{{ message }}</p>
  }
</div>
